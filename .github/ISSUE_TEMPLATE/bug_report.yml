name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool is affected?
      options:
        - copy (fast bulk copy)
        - forward (Download-Upload bypass)
        - extract (corpus builder)
        - process (Arabic preprocessor)
        - login / authentication
        - Gradio web UI
        - CLI (tg-tools)
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details.
      placeholder: |
        - OS: Manjaro Linux
        - Python: 3.11.5
        - telegram-tools version: 1.0.0
        - Telethon version: 1.36.0
        - Deployment: Docker / local / HF Spaces
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Add screenshots or error logs if applicable. Do NOT paste session strings or API hashes.
